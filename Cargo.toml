[package]
name = "rs-nes"
version = "0.1.0"
edition = "2024"
description = "Learning NES emulator — macOS .app/DMG, portable Linux/Windows"
license = "MIT"

[[bin]]
name = "rs-nes"
path = "src/main.rs"

[dependencies]
glfw = "0.59"
gl = "0.14"
cpal = "0.15"
rfd = "0.15"

# macOS: force Regular activation so keyboard goes to the game window
# (rfd's file dialog can leave the process as Prohibited / Accessory).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
